  <title>ioBroker.yamaha</title>
  <!-- ONE fixed colour, never currentColor: the logo is embedded as <img>, which inherits
       nothing. A media query would follow the OPERATING SYSTEM's scheme, not the Admin's
       theme (the two disagree all the time), so the colour has to read on both: #78869a is
       3.7:1 on white and 3.6–5.1:1 on the Admin's dark backgrounds (#303030 … #121212). -->
  <circle cx="256" cy="256" r="234" />
  <path d="M236,104 L236,212 L256,246 L276,212 L276,104" transform="rotate(0 256 256)" />
  <path d="M236,104 L236,212 L256,246 L276,212 L276,104" transform="rotate(120 256 256)" />
  <path d="M236,104 L236,212 L256,246 L276,212 L276,104" transform="rotate(240 256 256)" />
