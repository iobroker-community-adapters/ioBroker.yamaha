# Dependabot will run on day 2 of each month at 02:30 (Europe/Berlin timezone)
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '55 3 20 * *'
    open-pull-requests-limit: 15
    versioning-strategy: 'increase'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'

  # src-admin (Module-Federation admin component): hand-pinned compatibility matrix
  # (React / MUI / @module-federation/vite — the versions the component was built against);
  # npm-latest breaks the MF build. This entry exists ONLY to satisfy repochecker W8905
  # (a non-root package.json must be covered by a dependabot npm directory). Ignoring all
  # dependencies means it generates ZERO pull requests, so the pinned matrix is never moved.
  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '55 3 20 * *'
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '55 3 20 * *'
    open-pull-requests-limit: 15
