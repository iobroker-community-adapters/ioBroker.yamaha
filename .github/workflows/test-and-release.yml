name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
  push:
    branches:
      # `developing` is where the work happens and `master` is the release branch, so
      # both have to be tested. Without developing, a change is first seen by a Windows
      # runner when the release tag is already pushed — which is exactly how v1.1.0 was
      # tagged with a test that only fails on Windows.
      - "master"
      - "developing"
    tags:
      # normal versions
      - "v[0-9]+.[0-9]+.[0-9]+"
      # pre-releases
      - "v[0-9]+.[0-9]+.[0-9]+-**"
    # Reine Doku-Pushes lösen keinen Lauf aus: an einer Textzeile kann kein
    # Test fallen. Laut GitHub-Doku gilt "Path filters are not evaluated for
    # pushes of tags" — der Release-Lauf am Tag bleibt also unberührt. Bewusst
    # NUR unter `push`, nicht unter `pull_request`: dort liefert der Lauf den
    # Pflicht-Prüfauftrag der Branch-Sperre (Dependabot-Zusammenführung).
    # Der Filter greift auf die DATEIEN des Pushes — anders als ein `[skip ci]`
    # in der Nachricht, das den ganzen Push verschluckt, auch wenn Quellcode
    # mitfährt (fleet-weit 47-mal passiert, Stand 2026-09-03).
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check@v2
        with:
          node-version: "24.x"
          type-checking: true
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: [check-and-lint]

    if: contains(github.event.head_commit.message, '[skip ci]') == false

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          build: true

  # Deploys the final package to NPM
  deploy:
    needs: [check-and-lint, adapter-tests]

    # Trigger this step only when a commit on any branch is tagged with a version number
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    # Write permissions are required to create GitHub releases
    # id-token is required for npm Trusted Publishing
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
